<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Form</title>
		<link rel="stylesheet" href="./style/style.css" />
	</head>
	<body>
		<form class="form">
			<legend class="title">Ваши личные данные</legend>
			<label class="label">
				Ваше имя
				<input
					class="input"
					type="text"
					placeholder="Имя"
					name="name"
					required
				/>
			</label>
			<label class="label">
				Ваш возраст
				<input
					class="input"
					type="number"
					placeholder="Возраст"
					name="age"
					required
				/>
			</label>
			<label class="label">
				Ваш номер телефона
				<input
					class="input"
					type="tel"
					inputmode="numeric"
					placeholder="Номер телефона"
					name="phone"
					required
				/>
			</label>
			<label class="label">
				Ваша почта
				<input
					class="input"
					type="email"
					placeholder="Почта"
					name="email"
					required
				/>
			</label>
			<label class="label">
				Сообщение
				<textarea
					class="input"
					id="message"
					placeholder="Ваше сообщение"
					name="message"
					required
				></textarea>
			</label>
			<label class="checkbox">
				<input
					type="checkbox"
					type="checkbox"
					name="checkbox"
					required
				/>

				<span class="checkbox-text">Я принимаю правила</span>
			</label>
			<button class="button">Отправить</button>
		</form>
	</body>
</html>
